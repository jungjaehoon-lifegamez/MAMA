name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type used only when bump_versions is true'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      packages:
        description: 'Packages to release (comma-separated or "all")'
        required: true
        default: 'mama-core,mama-os'
        type: string
      dry_run:
        description: 'Dry run (no actual publish)'
        required: false
        type: boolean
        default: false
      bump_versions:
        description: 'Bump package versions in this workflow. Leave false when versions were prepared by PR.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # Step 1: Resolve versions and create the release tag
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      mama_core_version: ${{ steps.versions.outputs.mama_core }}
      mama_server_version: ${{ steps.versions.outputs.mama_server }}
      mama_os_version: ${{ steps.versions.outputs.mama_os }}
      mama_plugin_version: ${{ steps.versions.outputs.mama_plugin }}
      release_tag: ${{ steps.versions.outputs.release_tag }}
      changelog: ${{ steps.changelog.outputs.content }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Configure git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Resolve release versions
        id: versions
        run: |
          RELEASE_TYPE="${{ inputs.release_type }}"
          PACKAGES="${{ inputs.packages }}"
          BUMP_VERSIONS="${{ inputs.bump_versions }}"

          # Validate all package.json files exist
          for pkg in packages/mama-core packages/mcp-server packages/standalone packages/claude-code-plugin; do
            if [[ ! -f "$pkg/package.json" ]]; then
              echo "::error::Package manifest not found: $pkg/package.json"
              exit 1
            fi
          done

          bump_version() {
            local current=$1
            local type=$2
            IFS='.' read -r major minor patch <<< "$current"
            case $type in
              major) echo "$((major + 1)).0.0" ;;
              minor) echo "$major.$((minor + 1)).0" ;;
              patch) echo "$major.$minor.$((patch + 1))" ;;
            esac
          }

          # Get current versions
          CORE_CURRENT=$(jq -r '.version' packages/mama-core/package.json)
          SERVER_CURRENT=$(jq -r '.version' packages/mcp-server/package.json)
          OS_CURRENT=$(jq -r '.version' packages/standalone/package.json)
          PLUGIN_CURRENT=$(jq -r '.version' packages/claude-code-plugin/package.json)
          # Calculate release versions. The protected-main release path expects versions to be
          # prepared in a PR before this workflow runs, so bump_versions defaults to false.
          CORE_NEW=$CORE_CURRENT
          SERVER_NEW=$SERVER_CURRENT
          OS_NEW=$OS_CURRENT
          PLUGIN_NEW=$PLUGIN_CURRENT

          if [[ "$BUMP_VERSIONS" == "true" && ("$PACKAGES" == "all" || "$PACKAGES" == *"mama-core"*) ]]; then
            CORE_NEW=$(bump_version "$CORE_CURRENT" "$RELEASE_TYPE")
            jq --arg v "$CORE_NEW" '.version = $v' packages/mama-core/package.json > tmp.json && mv tmp.json packages/mama-core/package.json
          fi

          if [[ "$BUMP_VERSIONS" == "true" && ("$PACKAGES" == "all" || "$PACKAGES" == *"mama-server"*) ]]; then
            SERVER_NEW=$(bump_version "$SERVER_CURRENT" "$RELEASE_TYPE")
            jq --arg v "$SERVER_NEW" '.version = $v' packages/mcp-server/package.json > tmp.json && mv tmp.json packages/mcp-server/package.json
          fi

          if [[ "$BUMP_VERSIONS" == "true" && ("$PACKAGES" == "all" || "$PACKAGES" == *"mama-os"*) ]]; then
            OS_NEW=$(bump_version "$OS_CURRENT" "$RELEASE_TYPE")
            jq --arg v "$OS_NEW" '.version = $v' packages/standalone/package.json > tmp.json && mv tmp.json packages/standalone/package.json
          fi

          if [[ "$BUMP_VERSIONS" == "true" && ("$PACKAGES" == "all" || "$PACKAGES" == *"mama-plugin"*) ]]; then
            PLUGIN_NEW=$(bump_version "$PLUGIN_CURRENT" "$RELEASE_TYPE")
            jq --arg v "$PLUGIN_NEW" '.version = $v' packages/claude-code-plugin/package.json > tmp.json && mv tmp.json packages/claude-code-plugin/package.json
            # Also update plugin.json
            jq --arg v "$PLUGIN_NEW" '.version = $v' packages/claude-code-plugin/.claude-plugin/plugin.json > tmp.json && mv tmp.json packages/claude-code-plugin/.claude-plugin/plugin.json
          fi

          # The plugin's .mcp.json pins the server version, and docs carry versions too.
          if [[ "$BUMP_VERSIONS" == "true" ]]; then
            node scripts/sync-versions.js
          fi

          # Determine release tag (use mama-os version as primary)
          RELEASE_TAG="v${OS_NEW}"

          echo "mama_core=$CORE_NEW" >> $GITHUB_OUTPUT
          echo "mama_server=$SERVER_NEW" >> $GITHUB_OUTPUT
          echo "mama_os=$OS_NEW" >> $GITHUB_OUTPUT
          echo "mama_plugin=$PLUGIN_NEW" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

          echo "### Version Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Current | New |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| mama-core | $CORE_CURRENT | $CORE_NEW |" >> $GITHUB_STEP_SUMMARY
          echo "| mama-server | $SERVER_CURRENT | $SERVER_NEW |" >> $GITHUB_STEP_SUMMARY
          echo "| mama-os | $OS_CURRENT | $OS_NEW |" >> $GITHUB_STEP_SUMMARY
          echo "| mama-plugin | $PLUGIN_CURRENT | $PLUGIN_NEW |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "bump_versions: $BUMP_VERSIONS" >> $GITHUB_STEP_SUMMARY

      - name: Extract changelog
        id: changelog
        run: |
          # The section whose heading names this release's MAMA OS version, as the tag does
          VERSION="${{ steps.versions.outputs.mama_os }}"
          CHANGELOG=$(awk -v heading="mama-os [$VERSION]" 'index($0, "## ") == 1 { if (found) exit; found = index($0, heading) > 0 } found' CHANGELOG.md)
          if [[ -z "$CHANGELOG" ]]; then
            echo "::error::CHANGELOG.md has no section for mama-os [$VERSION]"
            exit 1
          fi
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # The install command attached to this release installs the MAMA OS version it names; a
      # mismatch is refused here, before the tag and any publish (docs/development/work/install.md).
      - name: Check the install script names this release
        run: |
          VERSION="${{ steps.versions.outputs.mama_os }}"
          NAMED=$(sed -n 's/^ *MAMA_OS_VERSION=//p' packages/standalone/install/install.sh)
          if [[ "$NAMED" != "$VERSION" ]]; then
            echo "::error::install.sh installs mama-os '$NAMED', not $VERSION; node scripts/sync-versions.js writes it"
            exit 1
          fi

      - name: Commit version bumps
        if: ${{ !inputs.dry_run && inputs.bump_versions }}
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "::error::Inline version bumps are disabled for protected main. Prepare version bumps in a PR, merge it, then rerun this workflow with bump_versions=false."
            exit 1
          fi
          git add packages/*/package.json packages/claude-code-plugin/.claude-plugin/plugin.json \
            packages/claude-code-plugin/.mcp.json README.md packages/*/README.md \
            packages/standalone/install/install.sh
          git commit -m "chore: bump versions for ${{ steps.versions.outputs.release_tag }}" || echo "No changes to commit"

      - name: Create release tag
        if: ${{ !inputs.dry_run }}
        run: |
          if git rev-parse "${{ steps.versions.outputs.release_tag }}" >/dev/null 2>&1; then
            echo "::error::Tag already exists locally: ${{ steps.versions.outputs.release_tag }}"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.versions.outputs.release_tag }}" >/dev/null 2>&1; then
            echo "::error::Tag already exists on origin: ${{ steps.versions.outputs.release_tag }}"
            exit 1
          fi
          git tag ${{ steps.versions.outputs.release_tag }}
          git push origin ${{ steps.versions.outputs.release_tag }}

  # Step 2: Publish mama-core (dependency for others)
  publish-mama-core:
    needs: prepare-release
    if: ${{ !inputs.dry_run && (inputs.packages == 'all' || contains(inputs.packages, 'mama-core')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies (workspace-level)
        run: pnpm install --ignore-scripts

      - name: Build
        working-directory: packages/mama-core
        run: pnpm build

      - name: Publish
        working-directory: packages/mama-core
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Step 3: Publish mama-server (depends on mama-core)
  publish-mama-server:
    needs: [prepare-release, publish-mama-core]
    if: ${{ always() && !inputs.dry_run && (inputs.packages == 'all' || contains(inputs.packages, 'mama-server')) && (needs.publish-mama-core.result == 'success' || needs.publish-mama-core.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies (workspace-level)
        run: pnpm install --ignore-scripts

      # Exact, not a range: the plugin pins this server and installs this same core for its
      # hooks, and both open one database, so they must not resolve to different cores.
      - name: Replace workspace protocol
        working-directory: packages/mcp-server
        run: |
          CORE_VERSION=$(node -p "require('../mama-core/package.json').version")
          sed -i "s/\"workspace:\*\"/\"$CORE_VERSION\"/" package.json

      - name: Publish
        working-directory: packages/mcp-server
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Step 4: Publish mama-os
  publish-mama-os:
    needs: [prepare-release, publish-mama-core]
    if: ${{ always() && !inputs.dry_run && (inputs.packages == 'all' || contains(inputs.packages, 'mama-os')) && (needs.publish-mama-core.result == 'success' || needs.publish-mama-core.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies (workspace-level)
        run: pnpm install --ignore-scripts

      - name: Build (workspace-level for dependency ordering)
        run: pnpm build

      - name: Replace workspace protocol
        working-directory: packages/standalone
        run: |
          CORE_VERSION=$(node -p "require('../mama-core/package.json').version")
          sed -i "s/\"workspace:\*\"/\"^$CORE_VERSION\"/" package.json

      - name: Publish
        working-directory: packages/standalone
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Step 5: Sync Claude plugin to marketplace
  sync-plugin:
    needs: [prepare-release, publish-mama-server]
    # always(): publish-mama-server runs after a skipped publish-mama-core, and without it the skip
    # propagates here (v0.58.1 skipped the plugin sync this way).
    if: ${{ always() && !inputs.dry_run && (inputs.packages == 'all' || contains(inputs.packages, 'mama-plugin')) && needs.prepare-release.result == 'success' && (needs.publish-mama-server.result == 'success' || needs.publish-mama-server.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MAMA
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}
          path: mama

      - name: Checkout claude-plugins
        uses: actions/checkout@v6
        with:
          repository: jungjaehoon-lifegamez/claude-plugins
          token: ${{ secrets.PLUGIN_DEPLOY_TOKEN }}
          path: claude-plugins

      - name: Sync plugin files
        run: |
          rm -rf claude-plugins/plugins/mama
          mkdir -p claude-plugins/plugins/mama
          cp -r mama/packages/claude-code-plugin/.claude-plugin claude-plugins/plugins/mama/
          cp mama/packages/claude-code-plugin/.mcp.json claude-plugins/plugins/mama/
          cp -r mama/packages/claude-code-plugin/commands claude-plugins/plugins/mama/
          cp -r mama/packages/claude-code-plugin/scripts claude-plugins/plugins/mama/
          cp -r mama/packages/claude-code-plugin/skills claude-plugins/plugins/mama/
          cp -r mama/packages/claude-code-plugin/src claude-plugins/plugins/mama/
          cp mama/packages/claude-code-plugin/package.json claude-plugins/plugins/mama/
          cp mama/packages/claude-code-plugin/README.md claude-plugins/plugins/mama/

      # The marketplace copy is installed with npm, which cannot resolve workspace:*. Every sync
      # from v1.10.0 to v2.1.0 shipped it, so the install failed and no hook could load mama-core.
      # The version is exact, as the server's is: the hooks and the server open one database.
      - name: Replace workspace protocol
        run: |
          CORE_VERSION=$(jq -r '.version' mama/packages/mama-core/package.json)
          sed -i "s/\"workspace:\*\"/\"$CORE_VERSION\"/" claude-plugins/plugins/mama/package.json
          if grep -q '"workspace:' claude-plugins/plugins/mama/package.json; then
            echo "claude-plugins/plugins/mama/package.json still names a workspace: dependency" >&2
            exit 1
          fi

      # The plugin's hooks and the server it pins must run one core. A plugin released without
      # the server that matches its core would bring back two cores on one database.
      - name: Check the pinned server runs the plugin's core
        run: |
          CORE_VERSION=$(jq -r '.version' mama/packages/mama-core/package.json)
          SERVER_VERSION=$(jq -r '.version' mama/packages/mcp-server/package.json)
          PINNED=$(jq -r '.mcpServers.mama.args[-1]' claude-plugins/plugins/mama/.mcp.json)
          if [[ "$PINNED" != "@jungjaehoon/mama-server@$SERVER_VERSION" ]]; then
            echo "::error::.mcp.json runs $PINNED, not @jungjaehoon/mama-server@$SERVER_VERSION"
            exit 1
          fi
          # The registry can show a publish from the job before this one a few minutes late.
          PUBLISHED_CORE=""
          for attempt in $(seq 1 10); do
            PUBLISHED_CORE=$(npm view "@jungjaehoon/mama-core@$CORE_VERSION" version 2>/dev/null || true)
            [[ -n "$PUBLISHED_CORE" ]] && break
            sleep 30
          done
          if [[ "$PUBLISHED_CORE" != "$CORE_VERSION" ]]; then
            echo "::error::@jungjaehoon/mama-core@$CORE_VERSION is not on npm; the hooks could not install it. Release mama-core first"
            exit 1
          fi
          SERVER_CORE=""
          for attempt in $(seq 1 10); do
            # An unpublished version makes npm view exit non-zero: that is the case to retry.
            SERVER_CORE=$(npm view "@jungjaehoon/mama-server@$SERVER_VERSION" dependencies --json 2>/dev/null | jq -r '."@jungjaehoon/mama-core" // empty' || true)
            [[ -n "$SERVER_CORE" ]] && break
            sleep 30
          done
          if [[ "$SERVER_CORE" != "$CORE_VERSION" ]]; then
            echo "::error::@jungjaehoon/mama-server@$SERVER_VERSION depends on mama-core '${SERVER_CORE:-not found}', the plugin's hooks on $CORE_VERSION; release mama-server with this core"
            exit 1
          fi

      - name: Update marketplace.json
        run: |
          cd claude-plugins
          VERSION="${{ needs.prepare-release.outputs.mama_plugin_version }}"
          DESCRIPTION=$(jq -r '.description' plugins/mama/.claude-plugin/plugin.json)
          # Use name selector instead of hardcoded index [0]
          jq --arg ver "$VERSION" --arg desc "$DESCRIPTION" \
            '(.plugins[] | select(.name == "mama")) |= (.version = $ver | .description = $desc)' \
            .claude-plugin/marketplace.json > tmp.json && mv tmp.json .claude-plugin/marketplace.json

      - name: Commit and push
        run: |
          cd claude-plugins
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          # An already synced repository has nothing to commit; that is not a failure.
          if git diff --cached --quiet; then
            echo "claude-plugins already matches v${{ needs.prepare-release.outputs.mama_plugin_version }}"
            exit 0
          fi
          git commit -m "chore: Sync MAMA plugin v${{ needs.prepare-release.outputs.mama_plugin_version }}"
          git push

  # Step 6: Deploy GitHub Pages
  deploy-pages:
    needs: prepare-release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build documentation site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Step 7: Create GitHub Release
  create-release:
    needs:
      [
        prepare-release,
        publish-mama-core,
        publish-mama-server,
        publish-mama-os,
        sync-plugin,
        deploy-pages,
      ]
    if: >-
      ${{
        !inputs.dry_run &&
        always() &&
        needs.prepare-release.result == 'success' &&
        (needs.publish-mama-core.result == 'success' || needs.publish-mama-core.result == 'skipped') &&
        (needs.publish-mama-server.result == 'success' || needs.publish-mama-server.result == 'skipped') &&
        (needs.publish-mama-os.result == 'success' || needs.publish-mama-os.result == 'skipped') &&
        (needs.sync-plugin.result == 'success' || needs.sync-plugin.result == 'skipped') &&
        needs.deploy-pages.result == 'success'
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}

      # The install command (install.sh, its version checked in prepare-release) installs this
      # MAMA OS from npm, so it is attached only once npm serves it, and only to a release that
      # publishes MAMA OS (publish-mama-os's condition): without it this version may not be on npm.
      - name: Wait for npm to serve this MAMA OS
        if: ${{ inputs.packages == 'all' || contains(inputs.packages, 'mama-os') }}
        run: |
          VERSION="${{ needs.prepare-release.outputs.mama_os_version }}"
          # The registry can show a publish from an earlier job a few minutes late.
          PUBLISHED=""
          for attempt in $(seq 1 10); do
            PUBLISHED=$(npm view "@jungjaehoon/mama-os@$VERSION" version 2>/dev/null || true)
            [[ -n "$PUBLISHED" ]] && break
            sleep 30
          done
          if [[ "$PUBLISHED" != "$VERSION" ]]; then
            echo "::error::@jungjaehoon/mama-os@$VERSION is not on npm; install.sh would fail to install it"
            exit 1
          fi

      - name: Create GitHub Release
        run: |
          cat > release-notes.md <<'EOF'
          ## MAMA ${{ needs.prepare-release.outputs.release_tag }}

          ### Package Versions
          | Package | Version | npm |
          |---------|---------|-----|
          | @jungjaehoon/mama-core | ${{ needs.prepare-release.outputs.mama_core_version }} | [![npm](https://img.shields.io/npm/v/@jungjaehoon/mama-core)](https://www.npmjs.com/package/@jungjaehoon/mama-core) |
          | @jungjaehoon/mama-server | ${{ needs.prepare-release.outputs.mama_server_version }} | [![npm](https://img.shields.io/npm/v/@jungjaehoon/mama-server)](https://www.npmjs.com/package/@jungjaehoon/mama-server) |
          | @jungjaehoon/mama-os | ${{ needs.prepare-release.outputs.mama_os_version }} | [![npm](https://img.shields.io/npm/v/@jungjaehoon/mama-os)](https://www.npmjs.com/package/@jungjaehoon/mama-os) |
          | mama (Claude Plugin) | ${{ needs.prepare-release.outputs.mama_plugin_version }} | Claude Marketplace |

          ### Installation

          **MAMA OS.** On the Mac that will run MAMA, open Claude Code or Codex and say:

          > Install MAMA OS from https://github.com/jungjaehoon-lifegamez/MAMA by following its owner setup guide, docs/start/owner-setup.md.

          The agent runs the install command attached to each MAMA OS release, and you never type in a terminal:

          ```bash
          curl -fsSL https://github.com/jungjaehoon-lifegamez/MAMA/releases/latest/download/install.sh | MAMA_INIT_MODEL=<model> sh -s -- --backend <claude|codex> --non-interactive
          ```

          With your own Node.js 22.13 or newer: `npm install -g @jungjaehoon/mama-os`, then `MAMA_INIT_BACKEND=claude MAMA_INIT_MODEL=<model> mama init --non-interactive`. Supported versions are listed in the [owner setup guide](https://github.com/jungjaehoon-lifegamez/MAMA/blob/main/docs/start/owner-setup.md#supported-versions). macOS is supported; Linux over SSH or without a desktop has no setup path yet, and Docker has no image yet.

          ```bash
          # MCP Server (Claude Desktop/Code)
          npx @jungjaehoon/mama-server

          # Claude Code Plugin
          /plugin marketplace add jungjaehoon-lifegamez/claude-plugins
          /plugin install mama
          ```

          ### Changelog
          ${{ needs.prepare-release.outputs.changelog }}

          ---
          📚 [Documentation](https://jungjaehoon-lifegamez.github.io/MAMA)
          EOF

          gh release create "${{ needs.prepare-release.outputs.release_tag }}" \
            --title "MAMA ${{ needs.prepare-release.outputs.release_tag }}" \
            --notes-file release-notes.md \
            --verify-tag \
            ${INSTALL_SCRIPT:+"$INSTALL_SCRIPT"}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Attached only when this release publishes MAMA OS, as the wait above.
          INSTALL_SCRIPT: ${{ (inputs.packages == 'all' || contains(inputs.packages, 'mama-os')) && 'packages/standalone/install/install.sh' || '' }}

  # Summary job
  summary:
    needs:
      [
        prepare-release,
        publish-mama-core,
        publish-mama-server,
        publish-mama-os,
        sync-plugin,
        deploy-pages,
        create-release,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Release Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| prepare-release | ${{ needs.prepare-release.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| publish-mama-core | ${{ needs.publish-mama-core.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| publish-mama-server | ${{ needs.publish-mama-server.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| publish-mama-os | ${{ needs.publish-mama-os.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| sync-plugin | ${{ needs.sync-plugin.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| deploy-pages | ${{ needs.deploy-pages.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| create-release | ${{ needs.create-release.result }} |" >> $GITHUB_STEP_SUMMARY
