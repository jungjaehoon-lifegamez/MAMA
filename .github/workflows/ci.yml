name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  # Detect which packages changed (PR only)
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      standalone: ${{ steps.filter.outputs.standalone }}
      plugin: ${{ steps.filter.outputs.plugin }}
      mcp_server: ${{ steps.filter.outputs.mcp_server }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            core:
              - 'packages/mama-core/**'
              - 'pnpm-lock.yaml'
            standalone:
              - 'packages/standalone/**'
              - 'packages/mama-core/**'
              - 'pnpm-lock.yaml'
            plugin:
              - 'packages/claude-code-plugin/**'
              - 'packages/mama-core/**'
              - 'pnpm-lock.yaml'
            mcp_server:
              - 'packages/mcp-server/**'
              - 'packages/mama-core/**'
              - 'pnpm-lock.yaml'

  # Shared setup (reusable)
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - run: pnpm install
      - run: pnpm build
      - uses: actions/cache/save@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            packages/standalone/ui/node_modules
            packages/standalone/public/viewer
          key: ${{ runner.os }}-build-${{ github.sha }}

  # Test mama-core
  test-core:
    needs: [changes, setup]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            packages/standalone/ui/node_modules
            packages/standalone/public/viewer
          key: ${{ runner.os }}-build-${{ github.sha }}
      - name: Test mama-core
        run: pnpm --filter @jungjaehoon/mama-core test
        env:
          MAMA_FORCE_TIER_3: true

  # Test standalone (depends on core)
  test-standalone:
    needs: [changes, setup]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.standalone == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            packages/standalone/ui/node_modules
            packages/standalone/public/viewer
          key: ${{ runner.os }}-build-${{ github.sha }}
      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/transformers
          key: ${{ runner.os }}-hf-models-v1
          restore-keys: ${{ runner.os }}-hf-models-
      - name: Test standalone
        run: pnpm --filter @jungjaehoon/mama-os test
        env:
          MAMA_FORCE_TIER_3: true

  # The previous published MAMA OS sets up an install and writes to it; this build boots on it and
  # reads it back (v1.md R5). Then `mama update` takes that install from this build to a renumbered
  # copy through a local registry and rolls back from one that exits at boot (update.md PR 3; a
  # stand-in service manager, so launchd and systemd are not part of the proof). Outside
  # `pnpm test`: it installs from npm and loads the embedding model.
  upgrade-check:
    needs: [changes, setup]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.standalone == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            packages/standalone/ui/node_modules
            packages/standalone/public/viewer
          key: ${{ runner.os }}-build-${{ github.sha }}
      # The same model the MCP tests use, restored or downloaded fully before the check embeds.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/transformers
          key: ${{ runner.os }}-hf-e5-large-q8-v1
      - name: Prepare embedding model
        working-directory: packages/standalone
        run: |
          node --input-type=module -e "
          import { homedir } from 'node:os'; import { join } from 'node:path';
          import { declareEmbeddingCacheDir, generateEmbedding } from '@jungjaehoon/mama-core/embeddings';
          declareEmbeddingCacheDir(join(homedir(), '.cache', 'huggingface', 'transformers'));
          const v = await generateEmbedding('warm');
          if (!v || v.length !== 1024) throw new Error('embedding model did not load');
          "
      - name: Upgrade from the previous release, then mama update and its rollback
        run: node packages/standalone/scripts/upgrade-check/run.mjs

  # Test plugin (independent)
  test-plugin:
    needs: [changes, setup]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.plugin == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            packages/standalone/ui/node_modules
            packages/standalone/public/viewer
          key: ${{ runner.os }}-build-${{ github.sha }}
      - name: Test plugin
        run: pnpm --filter mama-plugin test
        env:
          MAMA_FORCE_TIER_3: true

  # Test mcp-server (independent)
  test-mcp-server:
    needs: [changes, setup]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.mcp_server == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            packages/standalone/ui/node_modules
            packages/standalone/public/viewer
          key: ${{ runner.os }}-build-${{ github.sha }}
      # The MCP tests embed with the real model; a download inside a 30 s test timeout left a
      # truncated model file. Restore it, or download it fully before the tests start.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/transformers
          key: ${{ runner.os }}-hf-e5-large-q8-v1
      - name: Prepare embedding model
        working-directory: packages/mcp-server
        run: |
          node --input-type=module -e "
          import { homedir } from 'node:os'; import { join } from 'node:path';
          import { declareEmbeddingCacheDir, generateEmbedding } from '@jungjaehoon/mama-core/embeddings';
          declareEmbeddingCacheDir(join(homedir(), '.cache', 'huggingface', 'transformers'));
          const v = await generateEmbedding('warm');
          if (!v || v.length !== 1024) throw new Error('embedding model did not load');
          "
      - name: Test mcp-server
        run: pnpm --filter @jungjaehoon/mama-server test
        env:
          MAMA_FORCE_TIER_3: true

  # Lint (always run)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
      - run: pnpm install
      - run: pnpm lint
        continue-on-error: true
