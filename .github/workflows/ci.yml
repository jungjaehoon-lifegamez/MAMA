name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  # Detect which packages changed (PR only)
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      standalone: ${{ steps.filter.outputs.standalone }}
      plugin: ${{ steps.filter.outputs.plugin }}
      mcp_server: ${{ steps.filter.outputs.mcp_server }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            core:
              - 'packages/mama-core/**'
              - 'pnpm-lock.yaml'
            standalone:
              - 'packages/standalone/**'
              - 'packages/mama-core/**'
              - 'pnpm-lock.yaml'
            plugin:
              - 'packages/claude-code-plugin/**'
              - 'packages/mama-core/**'
              - 'pnpm-lock.yaml'
            mcp_server:
              - 'packages/mcp-server/**'
              - 'packages/mama-core/**'
              - 'pnpm-lock.yaml'
            docker:
              - 'packages/standalone/docker/**'
              - 'packages/standalone/src/cli/runtime/container.ts'
              - 'packages/standalone/src/cli/commands/update.ts'
              - '.github/workflows/ci.yml'

  # Shared setup (reusable)
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - run: pnpm install
      - run: pnpm build
      - uses: actions/cache/save@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            packages/standalone/ui/node_modules
            packages/standalone/public/viewer
          key: ${{ runner.os }}-build-${{ github.sha }}

  # Test mama-core
  test-core:
    needs: [changes, setup]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            packages/standalone/ui/node_modules
            packages/standalone/public/viewer
          key: ${{ runner.os }}-build-${{ github.sha }}
      - name: Test mama-core
        run: pnpm --filter @jungjaehoon/mama-core test
        env:
          MAMA_FORCE_TIER_3: true

  # Test standalone (depends on core)
  test-standalone:
    needs: [changes, setup]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.standalone == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            packages/standalone/ui/node_modules
            packages/standalone/public/viewer
          key: ${{ runner.os }}-build-${{ github.sha }}
      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/transformers
          key: ${{ runner.os }}-hf-models-v1
          restore-keys: ${{ runner.os }}-hf-models-
      - name: Test standalone
        run: pnpm --filter @jungjaehoon/mama-os test
        env:
          MAMA_FORCE_TIER_3: true

  # The previous published MAMA OS sets up an install and writes to it; this build boots on it and
  # reads it back (v1.md R5). Then `mama update` takes that install from this build to a renumbered
  # copy through a local registry and rolls back from one that exits at boot (update.md PR 3; a
  # stand-in service manager, so launchd and systemd are not part of the proof). Outside
  # `pnpm test`: it installs from npm and loads the embedding model.
  upgrade-check:
    needs: [changes, setup]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.standalone == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            packages/standalone/ui/node_modules
            packages/standalone/public/viewer
          key: ${{ runner.os }}-build-${{ github.sha }}
      # The same model the MCP tests use, restored or downloaded fully before the check embeds.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/transformers
          key: ${{ runner.os }}-hf-e5-large-q8-v1
      - name: Prepare embedding model
        working-directory: packages/standalone
        run: |
          node --input-type=module -e "
          import { homedir } from 'node:os'; import { join } from 'node:path';
          import { declareEmbeddingCacheDir, generateEmbedding } from '@jungjaehoon/mama-core/embeddings';
          declareEmbeddingCacheDir(join(homedir(), '.cache', 'huggingface', 'transformers'));
          const v = await generateEmbedding('warm');
          if (!v || v.length !== 1024) throw new Error('embedding model did not load');
          "
      - name: Upgrade from the previous release, then mama update and its rollback
        run: node packages/standalone/scripts/upgrade-check/run.mjs

  # The install command (docs/development/work/install.md, PR 1): install/install.sh on a fresh
  # HOME on macOS and Ubuntu. Ubuntu checks shellcheck, the synced version lines and the pinned
  # Node's signed hashes. On both, the script's own tests run on that platform's shell tools, and
  # run.mjs installs this build from a local registry with the real Node download and the vendors'
  # backend installers, then inits it, writes the service files through a stand-in service manager
  # and checks what they run. Then it boots that install's daemon and moves its Node (PR 2): a
  # patch pin, the move killed after each step and recovered, a Node that cannot boot put back, and
  # a major pin with the npm prefix rebuilt.
  install-check:
    needs: [changes, setup]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.standalone == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
      # The setup job's build is Linux's; macOS builds its own.
      - if: runner.os == 'Linux'
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            packages/standalone/ui/node_modules
            packages/standalone/public/viewer
          key: ${{ runner.os }}-build-${{ github.sha }}
      - if: runner.os == 'macOS'
        run: pnpm install && pnpm build
      # The runner image's own shellcheck: nothing is downloaded for it.
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck --version && pnpm lint:sh
      # The script's MAMA OS version and Node pin are what package.json and node.json say.
      - name: sync-versions --check
        if: runner.os == 'Linux'
        run: node scripts/sync-versions.js --check
      - name: node-pin
        if: runner.os == 'Linux'
        run: bash packages/standalone/scripts/install-check/node-pin.sh
      - name: install.sh tests
        working-directory: packages/standalone
        run: npx vitest run tests/cli/install-script.test.ts
      - name: install.sh on a fresh HOME
        run: node packages/standalone/scripts/install-check/run.mjs --vendor-installers

  # The Docker image (v1 D1) built from this commit's package on a stock Ubuntu 24.04 runner, with
  # its AppArmor: the shell sandbox starts under the shipped seccomp profile and not under Docker's
  # default, and the container mode refuses mama update.
  image-check:
    needs: [changes, setup]
    if: ${{ needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            packages/standalone/ui/node_modules
            packages/standalone/public/viewer
          key: ${{ runner.os }}-build-${{ github.sha }}
      - name: Pack this commit's MAMA OS into the build context
        working-directory: packages/standalone
        run: pnpm pack --pack-destination /tmp/pack && mv /tmp/pack/*.tgz docker/mama-os.tgz
      - name: Build the image
        run: docker build -t mama-os:check packages/standalone/docker
      - name: MEASURE apparmor options (temporary)
        continue-on-error: true
        run: |
          set +e
          B='bwrap --ro-bind / / --dev /dev --proc /proc --unshare-net --unshare-pid --new-session --die-with-parent /bin/true'
          S=packages/standalone/docker/seccomp.json
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          echo "== A seccomp + apparmor=unconfined"; docker run --rm --security-opt seccomp=$S --security-opt apparmor=unconfined mama-os:check $B; echo "rc=$?"
          sudo tee /etc/apparmor.d/mama-docker >/dev/null <<'AA'
          #include <tunables/global>
          profile mama-docker flags=(attach_disconnected,mediate_deleted) {
            #include <abstractions/base>
            network,
            capability,
            file,
            umount,
            mount,
            pivot_root,
            userns,
            signal (receive) peer=unconfined,
            signal (send,receive) peer=mama-docker,
            deny @{PROC}/* w,
            deny @{PROC}/{[^1-9],[^1-9][^0-9],[^1-9s][^0-9y][^0-9s],[^1-9][^0-9][^0-9][^0-9/]*}/** w,
            deny @{PROC}/sys/[^k]** w,
            deny @{PROC}/sys/kernel/{?,??,[^s][^h][^m]**} w,
            deny @{PROC}/sysrq-trigger rwklx,
            deny @{PROC}/kcore rwklx,
            deny /sys/[^f]*/** wklx,
            deny /sys/f[^s]*/** wklx,
            deny /sys/fs/[^c]*/** wklx,
            deny /sys/fs/c[^g]*/** wklx,
            deny /sys/fs/cg[^r]*/** wklx,
            deny /sys/firmware/** rwklx,
            deny /sys/kernel/security/** rwklx,
            ptrace (trace,read,tracedby,readby) peer=mama-docker,
          }
          AA
          sudo sed -i 's/^          //' /etc/apparmor.d/mama-docker
          sudo apparmor_parser -r /etc/apparmor.d/mama-docker; echo "load rc=$?"
          echo "== B seccomp + apparmor=mama-docker"; docker run --rm --security-opt seccomp=$S --security-opt apparmor=mama-docker mama-os:check $B; echo "rc=$?"
          echo "== B2 + a shell net test"; docker run --rm --security-opt seccomp=$S --security-opt apparmor=mama-docker mama-os:check sh -c 'cat /proc/self/attr/current; bwrap --ro-bind / / --dev /dev --proc /proc --unshare-net /bin/sh -c "getent hosts example.com || echo nonet"'
          echo "== C sysctl apparmor_restrict_unprivileged_userns=0"; sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "== C1 seccomp only (docker-default)"; docker run --rm --security-opt seccomp=$S mama-os:check $B; echo "rc=$?"
          echo "== C2 seccomp + apparmor=unconfined"; docker run --rm --security-opt seccomp=$S --security-opt apparmor=unconfined mama-os:check $B; echo "rc=$?"
          echo "== C3 seccomp + apparmor=mama-docker"; docker run --rm --security-opt seccomp=$S --security-opt apparmor=mama-docker mama-os:check $B; echo "rc=$?"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
      - name: Sandbox under the shipped profile
        run: |
          docker run --rm --security-opt seccomp=packages/standalone/docker/seccomp.json mama-os:check \
            bwrap --ro-bind / / --dev /dev --proc /proc --unshare-net --unshare-pid --new-session --die-with-parent /bin/true
      - name: No sandbox under Docker's default profile
        run: |
          if docker run --rm mama-os:check bwrap --ro-bind / / --dev /dev --unshare-net /bin/true; then
            echo "::error::bwrap started under Docker's default seccomp; the shipped profile may no longer be needed"
            exit 1
          fi
      - name: The container mode refuses mama update
        run: |
          out=$(docker run --rm mama-os:check mama update 2>&1 || true)
          echo "$out"
          grep -q 'docker compose pull' <<<"$out"

  # Test plugin (independent)
  test-plugin:
    needs: [changes, setup]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.plugin == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            packages/standalone/ui/node_modules
            packages/standalone/public/viewer
          key: ${{ runner.os }}-build-${{ github.sha }}
      - name: Test plugin
        run: pnpm --filter mama-plugin test
        env:
          MAMA_FORCE_TIER_3: true

  # Test mcp-server (independent)
  test-mcp-server:
    needs: [changes, setup]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.mcp_server == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            packages/standalone/ui/node_modules
            packages/standalone/public/viewer
          key: ${{ runner.os }}-build-${{ github.sha }}
      # The MCP tests embed with the real model; a download inside a 30 s test timeout left a
      # truncated model file. Restore it, or download it fully before the tests start.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/transformers
          key: ${{ runner.os }}-hf-e5-large-q8-v1
      - name: Prepare embedding model
        working-directory: packages/mcp-server
        run: |
          node --input-type=module -e "
          import { homedir } from 'node:os'; import { join } from 'node:path';
          import { declareEmbeddingCacheDir, generateEmbedding } from '@jungjaehoon/mama-core/embeddings';
          declareEmbeddingCacheDir(join(homedir(), '.cache', 'huggingface', 'transformers'));
          const v = await generateEmbedding('warm');
          if (!v || v.length !== 1024) throw new Error('embedding model did not load');
          "
      - name: Test mcp-server
        run: pnpm --filter @jungjaehoon/mama-server test
        env:
          MAMA_FORCE_TIER_3: true

  # Lint (always run)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
      - run: pnpm install
      - run: pnpm lint
        continue-on-error: true
