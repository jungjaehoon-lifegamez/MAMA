title: MAMA
description: A local work agent and memory for development sessions.
url: 'https://jungjaehoon-lifegamez.github.io'
baseurl: '/MAMA'
remote_theme: just-the-docs/just-the-docs

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/

nav_sort: case_insensitive
plugins:
  - jekyll-relative-links
  - jekyll-seo-tag
relative_links:
  enabled: true
  collections: true

exclude:
  - development/plan.md
  - development/checks.md
  - development/work
  - development/research
  - website
  - superpowers
  - sdd
  - v10
  - planning
  - Gemfile
  - Gemfile.lock

collections:
  tutorials:
    output: true
    permalink: /:collection/:name
  guides:
    output: true
    permalink: /:collection/:name
  reference:
    output: true
    permalink: /:collection/:name
  explanation:
    output: true
    permalink: /:collection/:name

defaults:
  - scope:
      path: ''
    values:
      layout: default
  - scope:
      path: 'guides/telegram.md'
    values:
      title: Telegram
      parent: Guides
      nav_order: 11
  - scope:
      path: 'reference/configuration.md'
    values:
      title: Configuration
      parent: Reference
      nav_order: 2

aux_links:
  'GitHub':
    - 'https://github.com/jungjaehoon-lifegamez/MAMA'
  'npm':
    - 'https://www.npmjs.com/package/@jungjaehoon/mama-os'
aux_links_new_tab: true
footer_content: 'MIT License &copy; 2024-2026 SpineLift Team'
color_scheme: dark

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
